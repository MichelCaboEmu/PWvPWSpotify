name: Build PWvPWSpotify IPA
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct HTTPS link to the clean decrypted Spotify 9.1.78 IPA
        required: true
        type: string
      expected_sha256:
        description: Optional SHA-256 of the input IPA
        required: false
        type: string
        default: 90d018bcb849ccdb1dc6c12709272d86155cade35b5b87542cdd6952341cdb69
permissions:
  contents: read
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Mask IPA link
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: echo "::add-mask::$IPA_URL"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          path: theos
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: BillyCurtis/OpenSpotifySafariExtension
          ref: 6523fcd3a45796beb89ce82f3f9ba032c85ae837
          path: safari
      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages 'git+https://github.com/asdfzxcvbn/pyzule-rw.git@740d3716dcd98c20c000f12cdb88f1f0b2a533a4'
      - name: Download and validate input
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          mkdir -p ipa out
          case "$IPA_URL" in https://*) ;; *) echo 'An HTTPS URL is required'; exit 1 ;; esac
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --max-time 600 --silent --show-error "$IPA_URL" -o ipa/spotify.ipa
          python3 scripts/validate_ipa.py ipa/spotify.ipa --sha256 "$EXPECTED_SHA256" --report out/input-validation.json
      - name: Build and validate merged IPA
        run: bash scripts/build.sh ipa/spotify.ipa
      - name: Upload IPA, validation and corresponding source
        uses: actions/upload-artifact@v5
        with:
          name: PWvPWSpotify-9.1.78
          path: |
            out/PWvPWSpotify-9.1.78.ipa
            out/*validation.json
            out/upstreams.json
            out/PWvPWSpotify-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Result
        run: |
          echo '### PWvPWSpotify 9.1.78' >> "$GITHUB_STEP_SUMMARY"
          echo 'IPA built and structurally validated. Sign it with your own signing tool. Runtime on iPhone has not been tested by this workflow.' >> "$GITHUB_STEP_SUMMARY"
