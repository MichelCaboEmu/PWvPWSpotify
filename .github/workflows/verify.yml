name: Verify and compile fusion
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_probe:
        description: Run the experimental live provider probe (currently blocked on GitHub runners)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: python3 scripts/prepare.py
      - run: python3 -m unittest discover -s tests -v
      - run: bash build/spotipw/scripts/check-layers.sh build/spotipw/tweak/Sources
  compile:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test provider parsing and matching
        run: |
          xcrun clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter -framework Foundation \
            -I overlays/spotipw/Core tests/provider_harness.m \
            overlays/spotipw/Core/PWProviderSupport.m overlays/spotipw/Core/PWAppleParsing.m overlays/spotipw/Core/PWArtworkPolicy.m \
            -o /tmp/pw-provider-tests
          /tmp/pw-provider-tests
      - name: Test playlist parsing and audio matching
        run: |
          xcrun swiftc overlays/spotipw/Downloads/PWDownloadParsing.swift overlays/spotipw/Downloads/PWNativePlaylist.swift overlays/spotipw/Downloads/PWMetadataRules.swift overlays/spotipw/Downloads/PWYouTubeAccess.swift tests/download_rules.swift -o /tmp/pw-download-tests
          /tmp/pw-download-tests
      - name: Test persistent library and incremental playlists
        run: |
          xcrun swiftc overlays/spotipw/Downloads/PWDownloadParsing.swift overlays/spotipw/Downloads/PWLibraryCatalog.swift overlays/spotipw/Downloads/PWFolderIndex.swift overlays/spotipw/Downloads/PWMetadataRules.swift overlays/spotipw/Downloads/PWMediaRetry.swift overlays/spotipw/Downloads/PWAudiusPolicy.swift tests/library_catalog.swift -o /tmp/pw-library-tests
          /tmp/pw-library-tests
      - name: Test native local URI identity and finite Spotify queue payload
        run: |
          xcrun swiftc overlays/spotipw/Downloads/PWNativeLocalIdentity.swift tests/native_local_identity.swift -o /tmp/pw-native-local-tests
          /tmp/pw-native-local-tests
      - name: Test offline playlist membership and unavailable selections
        run: |
          xcrun swiftc overlays/spotipw/Downloads/PWOfflinePlaylistRules.swift tests/offline_playlist.swift -o /tmp/pw-offline-playlist-tests
          /tmp/pw-offline-playlist-tests
      - name: Test shared audio storage and safe consolidation
        run: |
          xcrun swiftc overlays/spotipw/Downloads/PWSharedAudioFile.swift tests/shared_audio.swift -o /tmp/pw-shared-audio-tests
          /tmp/pw-shared-audio-tests
      - name: Test audio transfer, progress, timeout and cancellation
        run: |
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macos13.0" overlays/spotipw/Downloads/PWDownloadParsing.swift overlays/spotipw/Downloads/PWYouTubeAccess.swift overlays/spotipw/Downloads/PWAudioTransfer.swift tests/audio_transfer.swift -o /tmp/pw-transfer-tests
          python3 tests/run_audio_transfer.py /tmp/pw-transfer-tests
      - name: Test DASH M4A normalization and decoded audio
        run: |
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macos13.0" overlays/spotipw/Downloads/PWAudioContainer.swift tests/audio_container.swift -o /tmp/pw-container-tests
          /tmp/pw-container-tests tests/fixtures/dash-aac.m4a.b64
      - name: Test metadata writing preserves playable audio
        run: |
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macos13.0" overlays/spotipw/Downloads/PWDownloadParsing.swift overlays/spotipw/Downloads/PWAudioContainer.swift overlays/spotipw/Downloads/PWAudioTags.swift tests/metadata_tags.swift -o /tmp/pw-metadata-tests
          /tmp/pw-metadata-tests tests/fixtures/dash-aac.m4a.b64
      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: dd5c14bb9d91311e221d51b5bfb8c9e5948156db
          path: theos
          submodules: recursive
      - name: Install tools
        run: brew install make dpkg ldid
      - name: Check changed iOS sources before Swift build
        run: bash scripts/check_features.sh
      - name: Test menu geometry and downloaded indicators on iOS simulator
        run: bash tests/run_ui_regressions.sh
      - name: Compile both modules (no IPA)
        run: bash scripts/build.sh --compile-check
  extractor:
    name: Live local extractor probe
    # The provider explicitly rejected this runner. Do not retry on every push.
    if: github.event_name == 'workflow_dispatch' && inputs.live_probe
    needs: check
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: python3 scripts/prepare.py
      - name: Extract public sample locally (failure is reported)
        run: |
          SOURCES=()
          while IFS= read -r file; do SOURCES+=("$file"); done < <(find build/spotipw/tweak/Sources/Shared/Downloads/YouTubeKit -name '*.swift' | sort)
          xcrun swiftc -swift-version 5 -target "$(uname -m)-apple-macos13.0" "${SOURCES[@]}" overlays/spotipw/Downloads/PWDownloadParsing.swift overlays/spotipw/Downloads/PWYouTubeAccess.swift tests/extractor_smoke.swift -o /tmp/pw-extractor-smoke
          python3 - <<'PY'
          import subprocess
          subprocess.run(['/tmp/pw-extractor-smoke', 'build/spotipw/PWYouTubeKit.bundle'], timeout=75, check=True)
          PY
